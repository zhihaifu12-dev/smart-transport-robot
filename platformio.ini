; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = stm32h750

[env]
; 让lib中的正式模块统一读取项目级配置头。
build_flags = -I include
; genericSTM32H750VB不声明cmsis-dap上传协议，使用OpenOCD自定义命令。
; 适用于标准CMSIS-DAP/SWD调试器，烧录地址为STM32H750用户Flash起始地址。
upload_protocol = custom
upload_command = "$PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd.exe" -s "$PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts" -f interface/cmsis-dap.cfg -f target/stm32h7x.cfg -c "adapter speed 4000" -c "program {$SOURCE} 0x08000000 verify reset exit"

[env:stm32h750]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
lib_ldf_mode = deep+
build_src_filter = -<*> +<main.cpp>
monitor_speed = 115200

[env:armtest]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
build_src_filter = -<*> +<tests/ArmTest.cpp>
monitor_speed = 115200

[env:storagetest]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
build_src_filter = -<*> +<tests/StorageTest.cpp>
monitor_speed = 115200

[env:pickstoragetest]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
build_flags = ${env.build_flags} -DSTORAGE_PICK_MODE=1
build_src_filter = -<*> +<tests/PickStorageTest.cpp>
monitor_speed = 115200

[env:puttest]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
build_src_filter = -<*> +<tests/PutTest.cpp>
monitor_speed = 115200

[env:m7digitheighttest]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
build_src_filter = -<*> +<tests/M7DigitHeightTest.cpp>
monitor_speed = 115200

[env:showcase]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
lib_ldf_mode = deep+
build_src_filter = -<*> +<tests/Showcase.cpp>
monitor_speed = 115200

[env:lighttest]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
build_src_filter = -<*> +<tests/LightTest.cpp>
monitor_speed = 115200

[env:moveonlytest]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
lib_ldf_mode = deep+
build_flags =
    ${env.build_flags}
    -DMOVETEST_ENABLE_ARM=0
    -DMOVETEST_ENABLE_CAMERA=0
    -DMOVETEST_REQUIRE_QR=0
build_src_filter = -<*> +<tests/MoveOnlyTest.cpp>
monitor_speed = 115200

[env:m5swingtest]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
lib_ldf_mode = deep+
build_src_filter = -<*> +<tests/M5SwingTest.cpp>
monitor_speed = 115200
